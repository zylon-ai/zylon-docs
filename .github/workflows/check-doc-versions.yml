name: Validate versioned docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-doc-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version navigation and redirects
        run: python3 scripts/check-doc-versions.py
      - name: Check bilingual Desktop manual
        run: python3 scripts/check-zylon-code-docs.py
      - name: Test redirect regressions
        run: python3 -m unittest discover -s scripts/tests
