pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    server {
    listen 8080;
    server_name _;
    root /tmp/zylon-docs;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    add_header Cache-Control no-cache always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = / { return 302 /docs/; }
    location = /docs { return 308 /docs/; }
    location /docs/ { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location / { return 404; }
    error_page 404 /docs/404.html;
    }
}
