name: Validate offline documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile all documentation and run behavior tests in the image build
        run: docker build -f offline/Dockerfile -t zylon-docs:ci .
      - name: Verify offline image with no network and a read-only filesystem
        run: bash offline/check-container.sh zylon-docs:ci
