name: Validate offline documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/release-tests/package-lock.json
      - run: npm --prefix .github/release-tests ci --ignore-scripts --no-audit --no-fund
      - name: Test release versioning and publication guards without external services
        run: npm --prefix .github/release-tests test

  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - airgap-version: ''
            expected-version: ''
          - airgap-version: '1.57'
            expected-version: '1.57'
          - airgap-version: '1.58'
            expected-version: '1.58'
          - airgap-version: 'unknown-version'
            expected-version: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile all documentation and run behavior tests in the image build
        env:
          AIRGAP_VERSION: ${{ matrix.airgap-version }}
        run: docker build -f offline/Dockerfile --build-arg "AIRGAP_VERSION=$AIRGAP_VERSION" -t zylon-docs:ci .
      - name: Verify offline image with no network and a read-only filesystem
        env:
          EXPECTED_VERSION: ${{ matrix.expected-version }}
        run: bash offline/check-container.sh zylon-docs:ci "$EXPECTED_VERSION"
